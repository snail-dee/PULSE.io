<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PULSE.IO</title>
<style>
:root {
    --bg: #05070d;
    --panel: #0b101d;
    --panel-light: #121a2e;
    --cyan: #00ffff;
    --pink: #ff007f;
    --gold: #ffcc00;
    --green: #39ff14;
    --border: #1c2842;
    --text: #eaf6ff;
    --muted: #6e82a6;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
}
#menu-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, rgba(5, 7, 13, 0.25) 0%, rgba(5, 7, 13, 0.88) 100%);
    z-index: 20;
    transition: opacity 0.2s ease;
}
#menu-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}
.menu-card {
    position: relative;
    width: 408px;
    max-width: 92vw;
    background: rgba(11, 16, 29, 0.86);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 24px 22px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.9), 0 0 38px rgba(0, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}
.menu-audio-bar {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 6px;
}
.icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #070b14;
    border: 1px solid var(--border);
    color: var(--cyan);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
}
.icon-btn:hover {
    border-color: var(--cyan);
    background: var(--panel-light);
}
.icon-btn.off {
    color: var(--muted);
}
.logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}
.logo-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #07131e;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.45), inset 0 0 12px rgba(0, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}
.logo-title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #ffffff;
    text-shadow: 0 0 18px rgba(0, 255, 255, 0.75);
}
.meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.mode-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--panel-light);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--cyan);
}
.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
}
.input-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 11px;
}
.name-input {
    width: 100%;
    height: 44px;
    background: #070b14;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 16px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.name-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0, 255, 255, 0.25);
}
.color-picker {
    display: flex;
    justify-content: center;
    gap: 12px;
}
.color-swatch {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.12s;
}
.color-swatch:hover {
    transform: scale(1.12);
}
.color-swatch.active {
    transform: scale(1.18);
    border-color: #ffffff;
}
.play-btn {
    position: relative;
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: var(--panel-light);
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
}
.play-btn:active {
    transform: scale(0.97);
}
.play-btn::before {
    content: '';
    position: absolute;
    width: 240%;
    height: 560%;
    background: conic-gradient(transparent 0deg, transparent 275deg, var(--cyan) 330deg, #ffffff 360deg);
    animation: spin-border 2.2s linear infinite;
}
.play-btn::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: #0e1729;
    border-radius: 10px;
    z-index: 1;
}
.play-btn:hover::after {
    background: #13213b;
}
.play-btn-content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
}
@keyframes spin-border {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.room-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
}
.room-row {
    width: 100%;
    display: flex;
    gap: 8px;
}
.room-btn {
    height: 40px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-light);
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
}
.room-btn:hover {
    border-color: var(--cyan);
    background: #16223b;
    color: var(--cyan);
}
.room-btn:active {
    transform: scale(0.97);
}
.room-btn-create {
    flex: 1;
}
.room-input {
    flex: 1;
    min-width: 0;
    height: 40px;
    background: #070b14;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 10px;
    color: var(--cyan);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    outline: none;
}
.room-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
}
.room-input::placeholder {
    color: var(--muted);
    letter-spacing: 1px;
    font-size: 11px;
}
#room-error {
    font-size: 12px;
    font-weight: 700;
    color: var(--pink);
    text-align: center;
    display: none;
}
#room-error.show {
    display: block;
}
.controls-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    gap: 6px;
}
.ctrl-item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
}
.ctrl-icon {
    padding: 0 6px;
    height: 22px;
    border-radius: 6px;
    background: #070b14;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cyan);
    flex-shrink: 0;
}
#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: none;
}
#hud.active {
    display: block;
}
.hud-top-left {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.hud-badge {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text);
}
.hud-badge svg {
    color: var(--cyan);
}
.hud-interactive {
    pointer-events: auto;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
}
.hud-interactive:hover {
    border-color: var(--cyan);
    background: var(--panel-light);
}
.hud-interactive.off svg {
    color: var(--muted);
}
#hud-room-code {
    letter-spacing: 2px;
    color: var(--cyan);
}
.leaderboard {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 196px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.lb-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 6px;
    border-radius: 6px;
}
.lb-row.me {
    background: #132238;
    color: var(--cyan);
}
.lb-name {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.lb-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}
#banner {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    background: var(--panel);
    border: 2px solid var(--cyan);
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffffff;
    text-shadow: 0 0 18px var(--cyan);
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 15;
    text-align: center;
    white-space: nowrap;
}
#banner.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}
#host-bar {
    position: fixed;
    top: 34%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 10px;
    z-index: 16;
    pointer-events: auto;
}
#host-bar.show {
    display: flex;
}
#kill-feed {
    position: absolute;
    bottom: 20px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.kf-item {
    background: var(--panel);
    border-left: 3px solid var(--pink);
    padding: 6px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu-overlay">
    <div class="menu-card">
        <div class="menu-audio-bar">
            <button class="icon-btn" id="menu-mute-btn" title="Toggle Audio"></button>
        </div>
        <div class="logo-wrap">
            <div class="logo-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#00ffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 22 12 12 22 2 12 12 2"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <div class="logo-title">PULSE.IO</div>
            <div class="meta-row">
                <div class="mode-pill">
                    <span class="dot"></span>
                    <span id="status-text">LIVE ARENA</span>
                </div>
            </div>
        </div>

        <div class="input-group">
            <input id="nickname" class="name-input" type="text" maxlength="12" placeholder="PLAYER NAME" autocomplete="off">
            <div class="color-picker" id="color-picker"></div>
        </div>

        <button class="play-btn" id="play-btn">
            <span class="play-btn-content">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
                PLAY
            </span>
        </button>

        <div class="room-section">
            <div class="room-row">
                <button class="room-btn room-btn-create" id="create-room-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
                    HOST
                </button>
                <input id="room-code-input" class="room-input" type="text" maxlength="4" placeholder="CODE" autocomplete="off">
                <button class="room-btn" id="join-room-btn">JOIN</button>
            </div>
            <div id="room-error"></div>
        </div>

        <div class="controls-row">
            <div class="ctrl-item"><div class="ctrl-icon">A/D</div><span>MOVE</span></div>
            <div class="ctrl-item"><div class="ctrl-icon">W</div><span>JUMP x2</span></div>
            <div class="ctrl-item"><div class="ctrl-icon">S</div><span>DROP</span></div>
        </div>
    </div>
</div>

<div id="hud">
    <div class="hud-top-left">
        <div class="hud-badge hud-interactive" id="exit-btn" title="Menu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
        <div class="hud-badge hud-interactive" id="hud-mute-btn" title="Toggle Audio"></div>
        <div class="hud-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span id="hud-alive">0</span>
        </div>
        <div class="hud-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="hud-time">0s</span>
        </div>
        <div class="hud-badge hud-interactive" id="room-badge" style="display:none" title="Copy Code">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span id="hud-room-code"></span>
        </div>
    </div>
    <div class="leaderboard" id="leaderboard"></div>
    <div id="kill-feed"></div>
</div>

<div id="banner"></div>
<div id="host-bar">
    <button class="room-btn" id="btn-start-private" style="border-color:#00ffff;color:#00ffff;">START MATCH</button>
    <button class="room-btn" id="btn-toggle-ai">AUTO AI: ON</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const COLORS = ['#00ffff', '#ff007f', '#39ff14', '#ffcc00', '#ff5500', '#b026ff'];
const WORLD_W = 800;
const WORLD_H = 520;

const ICON_SOUND_ON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
const ICON_SOUND_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';

const socket = io();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const menuOverlay = document.getElementById('menu-overlay');
const hud = document.getElementById('hud');
const statusText = document.getElementById('status-text');
const nicknameInput = document.getElementById('nickname');
const colorPicker = document.getElementById('color-picker');
const playBtn = document.getElementById('play-btn');
const createRoomBtn = document.getElementById('create-room-btn');
const joinRoomBtn = document.getElementById('join-room-btn');
const roomCodeInput = document.getElementById('room-code-input');
const roomErrorEl = document.getElementById('room-error');
const exitBtn = document.getElementById('exit-btn');
const menuMuteBtn = document.getElementById('menu-mute-btn');
const hudMuteBtn = document.getElementById('hud-mute-btn');
const roomBadge = document.getElementById('room-badge');
const hudRoomCode = document.getElementById('hud-room-code');
const hudAlive = document.getElementById('hud-alive');
const hudTime = document.getElementById('hud-time');
const leaderboardEl = document.getElementById('leaderboard');
const bannerEl = document.getElementById('banner');
const hostBar = document.getElementById('host-bar');
const btnStartPrivate = document.getElementById('btn-start-private');
const btnToggleAI = document.getElementById('btn-toggle-ai');
const killFeedEl = document.getElementById('kill-feed');

let viewW = window.innerWidth;
let viewH = window.innerHeight;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

let selectedColor = COLORS[0];
let myId = null;
let currentRoomId = null;
let inGame = false;
let platforms = [];
let latestState = null;
let renderPlayers = new Map();
let trails = new Map();
let particles = [];
let floatTexts = [];
let shake = 0;
let lastStateType = null;

// Web Audio 合成器
let audioCtx = null;
let isMuted = false;

function initAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function playSfx(type) {
    if (isMuted || !audioCtx || !inGame) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.09);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'doubleJump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.1);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.13);
    } else if (type === 'shard') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.setValueAtTime(880, now + 0.05);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.start(now); osc.stop(now + 0.17);
    } else if (type === 'shieldBreak') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.18);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now); osc.stop(now + 0.21);
    } else if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.22);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'death') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.26);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now); osc.stop(now + 0.29);
    } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.09);
        osc.frequency.setValueAtTime(659, now + 0.18);
        osc.frequency.setValueAtTime(880, now + 0.27);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
        osc.start(now); osc.stop(now + 0.5);
    }
}

function updateMuteUI() {
    const icon = isMuted ? ICON_SOUND_OFF : ICON_SOUND_ON;
    menuMuteBtn.innerHTML = icon;
    hudMuteBtn.innerHTML = icon;
    menuMuteBtn.classList.toggle('off', isMuted);
    hudMuteBtn.classList.toggle('off', isMuted);
}
updateMuteUI();

function toggleMute() {
    initAudio();
    isMuted = !isMuted;
    updateMuteUI();
}
menuMuteBtn.onclick = toggleMute;
hudMuteBtn.onclick = toggleMute;

const stars = Array.from({ length: 80 }, () => ({
    x: Math.random(),
    y: Math.random(),
    size: 1 + Math.random() * 1.8,
    alpha: 0.12 + Math.random() * 0.3
}));

COLORS.forEach((c) => {
    const el = document.createElement('div');
    el.className = 'color-swatch' + (c === selectedColor ? ' active' : '');
    el.style.background = c;
    el.style.boxShadow = `0 0 12px ${c}`;
    el.onclick = () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        selectedColor = c;
    };
    colorPicker.appendChild(el);
});

function resize() {
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(viewW * dpr);
    canvas.height = Math.floor(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const keys = { left: false, right: false, jump: false, down: false };

function sendInput() {
    if (!inGame) return;
    socket.emit('input', keys);
}

window.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', ' '].includes(e.key)) e.preventDefault();
    let changed = false;
    if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { if (!keys.left) { keys.left = true; changed = true; } }
    if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') { if (!keys.right) { keys.right = true; changed = true; } }
    if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp' || e.key === ' ') { if (!keys.jump) { keys.jump = true; changed = true; } }
    if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { if (!keys.down) { keys.down = true; changed = true; } }
    if (changed) sendInput();
});

window.addEventListener('keyup', (e) => {
    let changed = false;
    if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { if (keys.left) { keys.left = false; changed = true; } }
    if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') { if (keys.right) { keys.right = false; changed = true; } }
    if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp' || e.key === ' ') { if (keys.jump) { keys.jump = false; changed = true; } }
    if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { if (keys.down) { keys.down = false; changed = true; } }
    if (changed) sendInput();
});

function showRoomError(msg) {
    roomErrorEl.textContent = msg;
    roomErrorEl.classList.add('show');
    clearTimeout(showRoomError._t);
    showRoomError._t = setTimeout(() => roomErrorEl.classList.remove('show'), 3000);
}

playBtn.onclick = () => {
    initAudio();
    socket.emit('join_public', { name: nicknameInput.value.trim() || 'PLAYER', color: selectedColor });
};

createRoomBtn.onclick = () => {
    initAudio();
    socket.emit('create_private', { name: nicknameInput.value.trim() || 'HOST', color: selectedColor });
};

joinRoomBtn.onclick = () => {
    initAudio();
    const code = roomCodeInput.value.trim().toUpperCase();
    if (code.length !== 4) {
        showRoomError('ENTER 4-LETTER CODE');
        return;
    }
    socket.emit('join_private', { name: nicknameInput.value.trim() || 'PLAYER', color: selectedColor, code });
};

roomCodeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinRoomBtn.click();
});

exitBtn.onclick = () => {
    socket.emit('leave_room');
    inGame = false;
    currentRoomId = null;
    myId = null;
    renderPlayers.clear();
    trails.clear();
    menuOverlay.classList.remove('hidden');
    hud.classList.remove('active');
    bannerEl.classList.remove('show');
    hostBar.classList.remove('show');
};

roomBadge.onclick = () => {
    if (!currentRoomId) return;
    navigator.clipboard?.writeText(currentRoomId).catch(() => {});
    const orig = currentRoomId;
    hudRoomCode.textContent = 'COPIED';
    setTimeout(() => { if (currentRoomId === orig) hudRoomCode.textContent = orig; }, 1200);
};

btnStartPrivate.onclick = () => socket.emit('start_private');
btnToggleAI.onclick = () => socket.emit('toggle_ai');

socket.on('init_preview', (data) => {
    platforms = data.platforms;
});

socket.on('error_msg', (msg) => showRoomError(msg));

socket.on('joined', (data) => {
    myId = data.playerId;
    currentRoomId = data.roomId;
    platforms = data.platforms;
    inGame = true;
    particles = [];
    floatTexts = [];
    renderPlayers.clear();
    trails.clear();
    killFeedEl.innerHTML = '';
    menuOverlay.classList.add('hidden');
    hud.classList.add('active');
    if (!data.isPublic) {
        roomBadge.style.display = 'flex';
        hudRoomCode.textContent = data.roomId;
    } else {
        roomBadge.style.display = 'none';
    }
});

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.5 + Math.random() * 4.8;
        particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            color,
            life: 24 + Math.random() * 18,
            maxLife: 42
        });
    }
}

function spawnFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 42, maxLife: 42 });
}

function addKillFeed(text) {
    const item = document.createElement('div');
    item.className = 'kf-item';
    item.textContent = text;
    killFeedEl.appendChild(item);
    setTimeout(() => item.remove(), 3200);
    if (killFeedEl.children.length > 4) killFeedEl.firstChild.remove();
}

socket.on('state', (state) => {
    latestState = state;

    if (!inGame) {
        statusText.textContent = `ONLINE ${state.humanCount}P + ${state.botCount} BOTS`;
    }

    if (inGame && state.state === 'ENDED' && lastStateType !== 'ENDED') {
        if (state.winner && state.winner.id === myId) playSfx('win');
    }
    lastStateType = state.state;

    if (state.events && state.events.length > 0) {
        for (const ev of state.events) {
            if (ev.type === 'death') {
                spawnParticles(ev.x, ev.y, ev.color, 22);
                if (inGame) {
                    shake = Math.min(16, shake + 10);
                    addKillFeed(`${ev.name} ELIMINATED`);
                    playSfx('death');
                }
            } else if (ev.type === 'shard') {
                spawnParticles(ev.x, ev.y, ev.color, 12);
                spawnFloatText(ev.x, ev.y - 10, ev.shield ? 'SHIELD UP!' : '+10', ev.color);
                if (inGame) playSfx('shard');
            } else if (ev.type === 'shieldBreak') {
                spawnParticles(ev.x, ev.y, ev.color, 18);
                spawnFloatText(ev.x, ev.y - 14, 'BLOCKED!', '#00ffff');
                if (inGame) { shake = Math.min(14, shake + 7); playSfx('shieldBreak'); }
            } else if (ev.type === 'laser') {
                if (inGame) playSfx('laser');
            } else if (ev.type === 'jump' && ev.id === myId) {
                playSfx(ev.dbl ? 'doubleJump' : 'jump');
            }
        }
    }

    if (!inGame) return;

    const aliveCount = state.players.filter(p => p.alive && !p.spectating).length;
    hudAlive.textContent = aliveCount;
    hudTime.textContent = `${state.roundSec}s`;

    const sorted = [...state.players].sort((a, b) => (b.alive - a.alive) || (b.score - a.score)).slice(0, 6);
    leaderboardEl.innerHTML = sorted.map(p => `
        <div class="lb-row ${p.id === myId ? 'me' : ''}" style="opacity:${p.alive && !p.spectating ? 1 : 0.35}">
            <div class="lb-name">
                <span class="lb-dot" style="background:${p.color};box-shadow:0 0 8px ${p.color}"></span>
                <span>${p.name}${p.spectating ? ' [SPEC]' : ''}</span>
            </div>
            <span>${p.score}</span>
        </div>
    `).join('');

    const me = state.players.find(p => p.id === myId);
    hostBar.classList.remove('show');

    if (state.state === 'COUNTDOWN') {
        bannerEl.textContent = `STARTING IN ${state.countdown}`;
        bannerEl.style.borderColor = '#00ffff';
        bannerEl.classList.add('show');
    } else if (state.state === 'LOBBY') {
        bannerEl.textContent = state.isPublic ? 'MATCHMAKING...' : `ROOM CODE: ${state.roomId}`;
        bannerEl.style.borderColor = '#00ffff';
        bannerEl.classList.add('show');
        if (!state.isPublic && state.hostId === myId) {
            hostBar.classList.add('show');
            btnToggleAI.textContent = `AUTO AI: ${state.fillAI ? 'ON' : 'OFF'}`;
        }
    } else if (state.state === 'ENDED') {
        const w = state.winner;
        bannerEl.textContent = w && w.name !== 'DRAW' ? `WINNER: ${w.name}` : 'DRAW // NEXT ROUND';
        bannerEl.style.borderColor = w ? w.color : '#00ffff';
        bannerEl.classList.add('show');
    } else if (me && me.spectating) {
        bannerEl.textContent = 'SPECTATING // JOINING NEXT ROUND';
        bannerEl.style.borderColor = '#ff007f';
        bannerEl.classList.add('show');
    } else if (me && !me.alive) {
        bannerEl.textContent = 'ELIMINATED // SPECTATING';
        bannerEl.style.borderColor = '#ff007f';
        bannerEl.classList.add('show');
    } else {
        bannerEl.classList.remove('show');
    }
});

function drawCorePlayer(p, rx, ry, now) {
    ctx.save();
    ctx.translate(rx, ry);

    if (p.invuln && Math.floor(now / 60) % 2 === 0) {
        ctx.globalAlpha = 0.45;
    }

    if (p.shield) {
        ctx.save();
        ctx.rotate(now * 0.004);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([8, 6]);
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#00ffff';
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    const stretchY = 1 + Math.max(-0.14, Math.min(0.16, -p.vy * 0.014));
    const stretchX = 1 / stretchY;

    ctx.save();
    ctx.rotate(p.vx * 0.045);
    ctx.scale(stretchX, stretchY);

    ctx.shadowBlur = 16;
    ctx.shadowColor = p.color;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(11, 0);
    ctx.lineTo(0, 11);
    ctx.lineTo(-11, 0);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05070d';
    const vx = p.facing * 3.5;
    ctx.fillRect(vx - 4, -3, 8, 5);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(vx - 2, -2, 4, 2);
    ctx.restore();

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 11px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, 0, -25);
    ctx.restore();
}

function drawTrap(t, now) {
    ctx.save();
    if (t.type === 'dart') {
        if (t.state === 'warn') {
            const alpha = 0.4 + 0.5 * Math.sin(now * 0.03);
            ctx.strokeStyle = `rgba(255, 0, 127, ${alpha})`;
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, t.y);
            ctx.lineTo(WORLD_W, t.y);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#ff007f';
            ctx.font = '900 18px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('!', t.dir === 1 ? 22 : WORLD_W - 22, t.y + 6);
        } else {
            ctx.translate(t.x, t.y);
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ff007f';
            ctx.fillStyle = '#ff007f';
            ctx.beginPath();
            ctx.moveTo(t.dir * 18, 0);
            ctx.lineTo(-t.dir * 14, -7);
            ctx.lineTo(-t.dir * 8, 0);
            ctx.lineTo(-t.dir * 14, 7);
            ctx.closePath();
            ctx.fill();
        }
    } else if (t.type === 'spike') {
        if (t.state === 'warn') {
            const alpha = 0.4 + 0.5 * Math.sin(now * 0.03);
            ctx.strokeStyle = `rgba(255, 204, 0, ${alpha})`;
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(t.x, 0);
            ctx.lineTo(t.x, 480);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#ffcc00';
            ctx.font = '900 18px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('!', t.x, 24);
        } else {
            ctx.translate(t.x, t.y);
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ffcc00';
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.moveTo(0, 14);
            ctx.lineTo(-10, -10);
            ctx.lineTo(10, -10);
            ctx.closePath();
            ctx.fill();
        }
    } else if (t.type === 'saw') {
        ctx.translate(t.x, t.y);
        ctx.rotate(now * 0.015);
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#ff007f';
        ctx.fillStyle = '#ff007f';
        const teeth = 8;
        ctx.beginPath();
        for (let i = 0; i < teeth * 2; i++) {
            const r = i % 2 === 0 ? t.r + 3 : t.r - 4;
            const a = (i * Math.PI) / teeth;
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#05070d';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
    } else if (t.type === 'flail') {
        if (t.state === 'warn') {
            const alpha = 0.35 + 0.45 * Math.sin(now * 0.03);
            ctx.strokeStyle = `rgba(176, 38, 255, ${alpha})`;
            ctx.setLineDash([8, 8]);
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(t.ax, t.ay, t.len, Math.PI / 2 - t.maxAngle, Math.PI / 2 + t.maxAngle);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#b026ff';
            ctx.font = '900 18px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('!', t.ax, 24);
        } else {
            ctx.strokeStyle = 'rgba(176, 38, 255, 0.85)';
            ctx.lineWidth = 3;
            ctx.setLineDash([7, 5]);
            ctx.beginPath();
            ctx.moveTo(t.ax, t.ay);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#b026ff';
            ctx.beginPath();
            ctx.arc(t.ax, t.ay + 4, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.translate(t.x, t.y);
            ctx.rotate(now * 0.008);
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#b026ff';
            ctx.fillStyle = '#121a2e';
            ctx.strokeStyle = '#b026ff';
            ctx.lineWidth = 3;

            const spikes = 10;
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? t.r + 5 : t.r - 3;
                const a = (i * Math.PI) / spikes;
                ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff007f';
            ctx.beginPath();
            ctx.arc(0, 0, 7, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (t.type === 'laser') {
        if (t.state === 'warn') {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.55)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, t.y);
            ctx.lineTo(WORLD_W, t.y);
            ctx.stroke();
        } else {
            ctx.shadowBlur = 24;
            ctx.shadowColor = '#00ffff';
            ctx.fillStyle = '#eaf6ff';
            ctx.fillRect(0, t.y - 7, WORLD_W, 14);
        }
    }
    ctx.restore();
}

function render(now) {
    requestAnimationFrame(render);

    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, viewW, viewH);

    for (const st of stars) {
        ctx.fillStyle = `rgba(180, 235, 255, ${st.alpha})`;
        ctx.fillRect(st.x * viewW, st.y * viewH, st.size, st.size);
    }

    const scale = Math.min(viewW / WORLD_W, viewH / WORLD_H) * 0.96;
    const offsetX = (viewW - WORLD_W * scale) * 0.5;
    const offsetY = (viewH - WORLD_H * scale) * 0.5;

    shake *= 0.85;
    if (shake < 0.2) shake = 0;
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;

    ctx.save();
    ctx.translate(offsetX + sx, offsetY + sy);
    ctx.scale(scale, scale);

    ctx.fillStyle = '#090e1a';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    ctx.strokeStyle = 'rgba(0, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= WORLD_W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); }
    for (let y = 0; y <= WORLD_H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); }
    ctx.stroke();

    ctx.strokeStyle = '#1c2842';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

    for (const plat of platforms) {
        ctx.save();
        ctx.fillStyle = plat.solid ? '#0b101d' : '#121a2e';
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ffff';
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(plat.x, plat.y, plat.w, 3);
        ctx.restore();
    }

    if (latestState) {
        for (const s of latestState.shards) {
            const bob = Math.sin(now * 0.006 + s.id) * 4;
            ctx.save();
            ctx.translate(s.x, s.y + bob);
            ctx.rotate(now * 0.002);
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#ffcc00';
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(8, 0);
            ctx.lineTo(0, 10);
            ctx.lineTo(-8, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        for (const t of latestState.traps) drawTrap(t, now);

        const activeIds = new Set();
        for (const p of latestState.players) {
            if (!p.alive || p.spectating) continue;
            activeIds.add(p.id);

            let rp = renderPlayers.get(p.id);
            if (!rp || Math.hypot(p.x - rp.x, p.y - rp.y) > 120) {
                rp = { x: p.x, y: p.y };
            } else {
                rp.x += (p.x - rp.x) * 0.45;
                rp.y += (p.y - rp.y) * 0.45;
            }
            renderPlayers.set(p.id, rp);

            let tr = trails.get(p.id);
            if (!tr) { tr = []; trails.set(p.id, tr); }
            tr.push({ x: rp.x, y: rp.y });
            if (tr.length > 7) tr.shift();

            for (let i = 0; i < tr.length - 1; i++) {
                const ratio = (i + 1) / tr.length;
                ctx.globalAlpha = ratio * 0.22;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(tr[i].x, tr[i].y, 11 * ratio, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            drawCorePlayer(p, rp.x, rp.y, now);
        }

        for (const id of renderPlayers.keys()) {
            if (!activeIds.has(id)) {
                renderPlayers.delete(id);
                trails.delete(id);
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = pt.life / pt.maxLife;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y -= 0.9;
        ft.life--;
        if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = ft.life / ft.maxLife;
        ctx.font = '900 14px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = ft.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    }

    ctx.restore();
}

requestAnimationFrame(render);
</script>
</body>
</html>
